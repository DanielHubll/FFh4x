<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Hub - Roblox</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --card: #1a1a2e;
            --accent: #e94560;
            --green: #0f9;
            --text: #eee;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            width: 380px;
            box-shadow: 0 0 30px rgba(233, 68, 96, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
        }

        h1 span { color: var(--accent); }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            padding: 10px;
            background: #111;
            border-radius: 8px;
            font-size: 13px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: red;
        }

        .dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            margin: 8px 0;
            background: #111;
            border-radius: 10px;
            transition: 0.2s;
        }

        .toggle-row:hover { background: #191919; }

        .toggle-row span { font-size: 15px; }
        .toggle-row small { color: #888; font-size: 11px; display: block; }

        /* Switch */
        .switch {
            position: relative;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #333;
            border-radius: 34px;
            transition: 0.3s;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .slider { background: var(--accent); }
        input:checked + .slider::before { transform: translateX(24px); }

        .server-input {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-connect { background: var(--accent); color: white; }
        .btn-disconnect { background: #333; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 <span>MEU</span> HUB</h1>

        <div class="status-bar">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Desconectado</span>
        </div>

        <!-- TOGGLES -->
        <div class="toggle-row">
            <div>
                <span>ESP Box</span>
                <small>Caixas nos jogadores</small>
            </div>
            <label class="switch">
                <input type="checkbox" id="espBox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-row">
            <div>
                <span>ESP Nome</span>
                <small>Nome dos jogadores</small>
            </div>
            <label class="switch">
                <input type="checkbox" id="espName">
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-row">
            <div>
                <span>ESP Distância</span>
                <small>Distância em studs</small>
            </div>
            <label class="switch">
                <input type="checkbox" id="espDistance">
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-row">
            <div>
                <span>Aimbot</span>
                <small>Mira automática</small>
            </div>
            <label class="switch">
                <input type="checkbox" id="aimbot">
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-row">
            <div>
                <span>Wallhack</span>
                <small>Ver através de paredes</small>
            </div>
            <label class="switch">
                <input type="checkbox" id="wallhack">
                <span class="slider"></span>
            </label>
        </div>

        <!-- SERVIDOR -->
        <input type="text" class="server-input" id="serverUrl"
               placeholder="wss://SEU_SERVIDOR.com"
               value="ws://localhost:3000">

        <button class="btn btn-connect" onclick="connect()">🔌 Conectar ao Servidor</button>
        <button class="btn btn-disconnect" onclick="disconnect()">❌ Desconectar</button>
    </div>

    <script>
        let ws = null;

        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (connected) {
                dot.classList.add('connected');
                text.textContent = 'Conectado ✅';
            } else {
                dot.classList.remove('connected');
                text.textContent = 'Desconectado';
            }
        }

        function connect() {
            const url = document.getElementById('serverUrl').value;
            ws = new WebSocket(url + '?type=site');

            ws.onopen = () => {
                console.log('Conectado ao servidor!');
                updateStatus(true);
            };

            ws.onclose = () => {
                console.log('Desconectado');
                updateStatus(false);
                ws = null;
            };

            ws.onerror = () => updateStatus(false);

            ws.onmessage = (e) => {
                console.log('Recebido:', e.data);
            };
        }

        function disconnect() {
            if (ws) ws.close();
            updateStatus(false);
        }

        function sendToggle(name, value) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: name, value: value }));
                console.log(`Enviado: ${name} = ${value}`);
            }
        }

        // Event listeners nos toggles
        document.getElementById('espBox').addEventListener('change', function() {
            sendToggle('espBox', this.checked);
        });
        document.getElementById('espName').addEventListener('change', function() {
            sendToggle('espName', this.checked);
        });
        document.getElementById('espDistance').addEventListener('change', function() {
            sendToggle('espDistance', this.checked);
        });
        document.getElementById('aimbot').addEventListener('change', function() {
            sendToggle('aimbot', this.checked);
        });
        document.getElementById('wallhack').addEventListener('change', function() {
            sendToggle('wallhack', this.checked);
        });

        // Auto conectar ao carregar
        window.onload = () => {
            const url = document.getElementById('serverUrl').value;
            if (url !== 'ws://localhost:3000' || window.location.hostname !== 'localhost') {
                // não auto-conecta em produção
            }
        };
    </script>
</body>
  </html>
